<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; color: #333; direction: rtl; text-align: center; }
        
        header { background: #111; color: #fff; padding: 20px; border-bottom: 4px solid #d4af37; }
        header h1 { font-size: 26px; color: #d4af37; margin-bottom: 5px; }

        .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 20px; color: #111; }

        .wheel-box { width: 250px; height: 250px; border: 10px solid #d4af37; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: #222; color: #fff; font-size: 18px; font-weight: bold; position: relative; }
        
        .spin-btn { background: #25d366; color: white; padding: 12px 25px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .spin-btn:hover { background: #1ebe5d; }
        
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #d4af37; }
    </style>
</head>
<body>

    <header>
        <h1>عجلة الحظ الترويجية</h1>
        <p>جرب حظك واحصل على خصومات وهدايا فورية من متاجر مول لبنان</p>
    </header>

    <div class="container">
        <h2>أوِدر العجلة واربح جائزتك!</h2>
        <div class="wheel-box" id="wheel">
            مول لبنان
        </div>
        <button class="spin-btn" onclick="spinWheel()">ابدأ تدوير العجلة</button>
        <div id="result"></div>
    </div>

    <script>
        function spinWheel() {
            let prizes = [
                "مبروك! خصم 10% على قسم الألبسة",
                "حظاً أوفر المرة القادمة",
                "مبروك! توصيل مجاني لطلبك الأول",
                "مبروك! خصم 5$ على قسم العطورات",
                "حظاً أوفر، جرب مرة أخرى"
            ];
            let randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
            document.getElementById('result').innerText = randomPrize;
        }
    </script>
</body>
</html>
