<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دولاب الحظ - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f4; color: #222; text-align: center; }
        
        header { background: #111; color: #fff; padding: 20px; border-bottom: 4px solid #d4af37; position: relative; }
        header h1 { font-size: 24px; color: #d4af37; }
        
        .back-btn { position: absolute; top: 15px; right: 15px; background: #d4af37; color: #111; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 13px; }
        
        .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #111; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; font-size: 15px; }

        /* تصميم الدولاب البسيط والأنيق */
        .wheel-container { position: relative; width: 280px; height: 280px; margin: 0 auto 25px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #d4af37; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0.90, 0.15, 1); background: #222; }
        
        .sector { position: absolute; width: 50%; height: 50%; top: 0; right: 50%; transform-origin: 100% 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: #fff; padding-left: 20px; }
        
        /* تقسيمات الجوائز */
        .sector:nth-child(1) { background: #111; transform: rotate(0deg) skewY(-30deg); color: #d4af37; }
        .sector:nth-child(2) { background: #333; transform: rotate(60deg) skewY(-30deg); }
        .sector:nth-child(3) { background: #111; transform: rotate(120deg) skewY(-30deg); color: #d4af37; }
        .sector:nth-child(4) { background: #444; transform: rotate(180deg) skewY(-30deg); }
        .sector:nth-child(5) { background: #111; transform: rotate(240deg) skewY(-30deg); color: #d4af37; }
        .sector:nth-child(6) { background: #222; transform: rotate(300deg) skewY(-30deg); }

        .pin { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid #d4af37; z-index: 10; }

        .spin-btn { background: #d4af37; color: #111; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
        .spin-btn:hover { background: #111; color: #d4af37; }

        .result-box { margin-top: 20px; font-size: 18px; font-weight: bold; color: #27ae60; min-height: 30px; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">🏠 الرئيسية</a>
    <h1>🎡 دولاب الحظ الفوري</h1>
</header>

<div class="container">
    <h2>جرب حظك واربح خصم لطلبيتك!</h2>
    <p>لف الدولاب واحصل على هدية فورية من مول لبنان</p>

    <div class="wheel-container">
        <div class="pin"></div>
        <div class="wheel" id="wheel">
            <div class="sector" style="transform: rotate(0deg) skewY(-30deg);"><span>خصم 10%</span></div>
            <div class="sector" style="transform: rotate(60deg) skewY(-30deg);"><span>هدية مفاجأة</span></div>
            <div class="sector" style="transform: rotate(120deg) skewY(-30deg);"><span>توصيل مجاني</span></div>
            <div class="sector" style="transform: rotate(180deg) skewY(-30deg);"><span>خصم 5$</span></div>
            <div class="sector" style="transform: rotate(240deg) skewY(-30deg);"><span>حظاً أوفر</span></div>
            <div class="sector" style="transform: rotate(300deg) skewY(-30deg);"><span>خصم 20%</span></div>
        </div>
    </div>

    <button class="spin-btn" onclick="spinWheel()">لف الدولاب الآن 🎯</button>
    <div class="result-box" id="result"></div>
</div>

<script>
    function spinWheel() {
        const wheel = document.getElementById('wheel');
        const result = document.getElementById('result');
        result.innerHTML = "عم يلف الدولاب... يا رب تربح! 🎁";
        
        const randomDegree = Math.floor(Math.random() * 360) + 1800;
        wheel.style.transform = `rotate(${randomDegree}deg)`;

        setTimeout(() => {
            const prizes = ["مبروك! ربحت خصم 10% على طلبيتك!", "يا عيني! ربحت توصيل مجاني لكل لبنان!", "مبروك! ربحت خصم 5$ فوري!", "حظاً أوفر، جرب مرة تانية!"];
            const winningPrize = prizes[Math.floor(Math.random() * prizes.length)];
            result.innerHTML = winningPrize;
        }, 4000);
    }
</script>

</body>
</html>
