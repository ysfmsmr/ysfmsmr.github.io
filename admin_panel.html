<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - مول لبنان</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --danger: #e74c3c;
            --whatsapp: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.3rem;
        }
        header p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 5px 0 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #333;
        }
        .stat-card h3 {
            margin: 0;
            color: #aaa;
            font-size: 0.85rem;
        }
        .stat-card .number {
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .section-title {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--primary);
        }
        .product-info h3 {
            margin: 0 0 5px;
            font-size: 1rem;
            color: var(--text);
        }
        .product-info p {
            margin: 2px 0;
            color: #aaa;
            font-size: 0.85rem;
        }
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .empty-msg {
            text-align: center;
            color: #777;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 10px;
            font-size: 0.95rem;
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ لوحة التحكم والإدارة العامة</h1>
            <p>مول لبنان الإلكتروني - إدارة العمليات والبضائع</p>
        </header>

        <!-- إحصائيات سريعة -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي المنتجات</h3>
                <div class="number" id="totalProductsCount">0</div>
            </div>
            <div class="stat-card">
                <h3>حالة النظام</h3>
                <div class="number" style="color: #2ecc71; font-size: 1rem; margin-top: 8px;">يعمل بانتظام</div>
            </div>
        </div>

        <div class="section-title">
            <span>📦 المنتجات المعروضة من التجار</span>
            <button class="action-btn" onclick="loadAdminData()">تحديث البيانات</button>
        </div>
        
        <div id="adminProductsList"></div>

        <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>
    </div>

    <script>
        function loadAdminData() {
            const container = document.getElementById('adminProductsList');
            const countElem = document.getElementById('totalProductsCount');
            
            let products = JSON.parse(localStorage.getItem('mallProducts')) || 
                           JSON.parse(localStorage.getItem('vendorProducts')) || [];

            countElem.innerText = products.length;

            if (products.length === 0) {
                container.innerHTML = `<div class="empty-msg">لا توجد منتجات مضافة حالياً.<br>قم بإضافة منتج من لوحة التاجر ليظهر هنا فوراً.</div>`;
                return;
            }

            container.innerHTML = '';
            products.forEach((product, index) => {
                container.innerHTML += `
                    <div class="card">
                        <div class="product-info">
                            <h3>${product.name || product.productName || 'منتج بدون اسم'}</h3>
                            <p>المحل: ${product.store || product.storeName || 'غير محدد'}</p>
                            <p>السعر: <span style="color: #2ecc71; font-weight: bold;">${product.price || 'غير محدد'}</span></p>
                            <p style="color: var(--whatsapp); font-size: 0.8rem; margin-top:4px;">هاتف الواتساب: ${product.phone || product.vendorPhone || 'غير متوفر'}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${index})">حذف</button>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) return;

            let products = JSON.parse(localStorage.getItem('mallProducts')) || 
                           JSON.parse(localStorage.getItem('vendorProducts')) || [];
            
            products.splice(index, 1);
            localStorage.setItem('mallProducts', JSON.stringify(products));
            loadAdminData();
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
