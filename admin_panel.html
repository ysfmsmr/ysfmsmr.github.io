<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #d4af37; }
        h2 { color: #d4af37; text-align: center; margin-bottom: 20px; font-size: 18px; }
        .store-card { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; }
        .store-info h4 { font-size: 14px; color: #fff; margin-bottom: 3px; }
        .store-info p { font-size: 11px; color: #bbb; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-active { background: #00e676; color: #000; }
        .btn-stopped { background: #e91e63; color: #fff; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #d4af37; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ لوحة تحكم الإدارة (التحكم بالمشتركين)</h2>

        <div id="stores-list">
            <!-- قائمة المحلات المشتركة -->
            <div class="store-card">
                <div class="store-info">
                    <h4>متجر الأزياء والموضة</h4>
                    <p>الاشتراك: <span id="sub-status-text">نشط</span></p>
                </div>
                <button id="toggle-sub-btn" class="action-btn btn-active" onclick="toggleSubscription()">إيقاف الحساب</button>
            </div>
        </div>

        <a href="index.html" class="back-link">⬅ العودة إلى الرئيسية</a>
    </div>

    <script>
        function checkStatus() {
            let isActive = localStorage.getItem('store_active') !== 'false';
            let btn = document.getElementById('toggle-sub-btn');
            let txt = document.getElementById('sub-status-text');

            if(isActive) {
                txt.innerText = "نشط (مدفوع)";
                txt.style.color = "#00e676";
                btn.innerText = "إيقاف الحساب";
                btn.className = "action-btn btn-active";
            } else {
                txt.innerText = "موقوف (لم يدفع)";
                txt.style.color = "#e91e63";
                btn.innerText = "تفعيل الحساب";
                btn.className = "action-btn btn-stopped";
            }
        }

        function toggleSubscription() {
            let isActive = localStorage.getItem('store_active') !== 'false';
            localStorage.setItem('store_active', !isActive);
            checkStatus();
            alert(isActive ? "تم إيقاف حساب التاجر بنجاح وتجميد منتجاته!" : "تم تفعيل حساب التاجر بنجاح!");
        }

        checkStatus();
    </script>
</body>
</html>
