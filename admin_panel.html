<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة مول لبنان</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.3rem;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .card h2 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ لوحة الإدارة العامة - مول لبنان</h1>
        </header>

        <div class="card">
            <h2>📊 حالة النظام</h2>
            <p>جميع أقسام المول والشاشة العملاقة وربط الواتساب تعمل بكفاءة تامة.</p>
        </div>

        <a href="index.html" class="back-btn">⬅️ العودة إلى الصفحة الرئيسية</a>
    </div>
</body>
</html>
