<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية | الأدمن</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: right;
        }

        h2 { color: var(--primary); }
        .btn-action {
            background: var(--primary);
            color: #000;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>⚙️ لوحة إدارة مول لبنان</h2>

    <div class="card">
        <h3>📊 إحصائيات عامة</h3>
        <p>عدد المحلات المشتركة: <strong>3</strong></p>
        <p>الاشتراكات النشطة: <span style="color: #25d366;">3 مدفوعة</span></p>
    </div>

    <div class="card">
        <h3>👑 طلبات العرض في الشاشة العملاقة</h3>
        <p>محل: بوتيك الأناقة - فستان سهرة</p>
        <button class="btn-action">موافقة وتثبيت بالواجهة</button>
    </div>

    <a href="index.html" style="color: var(--primary); text-decoration: none;">⬅️ معاينة الموقع الحقيقي</a>

</body>
</html>
