<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - مول لبنان</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1, h2 { color: #d4af37; text-align: center; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        th { background-color: #d4af37; color: #000; }
        .btn-approve { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #d4af37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ لوحة تحكم الإدارة - مول لبنان</h1>
        <p style="text-align: center; color: #aaa;">إدارة طلبات المتاجر وتفعيل حسابات التجار</p>

        <h2>طلبات الانضمام الجديدة</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم التاجر</th>
                    <th>اسم المحل</th>
                    <th>رقم الواتساب</th>
                    <th>وصف البضاعة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="vendorsTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #777;">جاري تحميل الطلبات...</td>
                </tr>
            </tbody>
        </table>

        <a href="index.html" class="back-link">← العودة إلى الصفحة الرئيسية للموقع</a>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات الاتصال بفايربيس الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyD...", // استبدل هذه الإعدادات بإعدادات مشروعك الحقيقية إذا لم تكن موجودة
            authDomain: "mall-lebanon.firebaseapp.com",
            projectId: "mall-lebanon",
            storageBucket: "mall-lebanon.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadVendorRequests() {
            const tableBody = document.getElementById("vendorsTableBody");
            try {
                const querySnapshot = await getDocs(collection(db, "vendor_requests"));
                tableBody.innerHTML = "";
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #777;">لا توجد طلبات انضمام حالياً</td></tr>`;
                    return;
                }

                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const row = document.createElement("tr");
                    
                    row.innerHTML = `
                        <td>${data.ownerName || 'غير محدد'}</td>
                        <td>${data.shopName || 'غير محدد'}</td>
                        <td>${data.phone || 'غير محدد'}</td>
                        <td>${data.description || 'غير محدد'}</td>
                        <td>
                            <button class="btn-approve" onclick="approveVendor('${documentSnap.id}', '${data.shopName}', '${data.phone}')">قبول</button>
                            <button class="btn-delete" onclick="deleteVendorRequest('${documentSnap.id}')">حذف</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error("خطأ في جلب الطلبات: ", error);
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4d4d;">خطأ في الاتصال بقاعدة البيانات</td></tr>`;
            }
        }

        // دالة قبول التاجر ونقله للمتاجر المفعلة
        window.approveVendor = async function(id, shopName, phone) {
            if(confirm(`هل أنتแนي من قبول محل "${shopName}"؟`)) {
                alert(`تم قبول التاجر بنجاح! سيتم ربط حسابه بلوحة التحكم الخاصة به.`);
                // يمكنك لاحقاً حفظه في جدول المتاجر المعتمدة هنا
                await deleteVendorRequest(id);
            }
        };

        // دالة حذف الطلب
        window.deleteVendorRequest = async function(id) {
            if(confirm("هل أنت متأكد من حذف هذا الطلب؟")) {
                try {
                    await deleteDoc(doc(db, "vendor_requests", id));
                    alert("تم الحذف بنجاح");
                    loadVendorRequests();
                } catch (error) {
                    alert("حدث خطأ أثناء الحذف");
                }
            }
        };

        // تشغيل الدالة عند تحميل الصفحة
        loadVendorRequests();
    </script>
</body>
</html>
