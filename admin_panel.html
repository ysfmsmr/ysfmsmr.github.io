<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم وإدارة البضائع</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --danger: #e74c3c;
            --whatsapp: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.3rem;
        }
        header p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 5px 0 0;
        }
        .section-title {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info h3 {
            margin: 0 0 5px;
            font-size: 1rem;
            color: var(--primary);
        }
        .product-info p {
            margin: 0;
            color: #aaa;
            font-size: 0.85rem;
        }
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .empty-msg {
            text-align: center;
            color: #777;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 10px;
            font-size: 0.95rem;
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ لوحة التحكم وإدارة البضائع</h1>
            <p>إدارة ومتابعة المنتجات المعروضة في مول لبنان</p>
        </header>

        <div class="section-title">📦 المنتجات المضافة من التجار</div>
        <div id="adminProductsList"></div>

        <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>
    </div>

    <script>
        function loadAdminProducts() {
            const container = document.getElementById('adminProductsList');
            // فحص عدة مفاتيح محتملة للتأكد من جلب البيانات أياً كان اسم المفتاح القديم
            let products = JSON.parse(localStorage.getItem('mallProducts')) || 
                           JSON.parse(localStorage.getItem('vendorProducts')) || [];

            if (products.length === 0) {
                container.innerHTML = `<div class="empty-msg">لا يوجد منتجات مضافة من التجار حالياً.<br>جرب تسجيل منتج جديد من لوحة التاجر لتظهر هنا فوراً.</div>`;
                return;
            }

            container.innerHTML = '';
            products.forEach((product, index) => {
                container.innerHTML += `
                    <div class="card">
                        <div class="product-info">
                            <h3>${product.name || product.productName || 'منتج بدون اسم'}</h3>
                            <p>المحل: ${product.store || product.storeName || 'غير محدد'} | السعر: ${product.price || 'غير محدد'}</p>
                            <p style="color: var(--whatsapp); font-size: 0.8rem; margin-top:4px;">هاتف: ${product.phone || product.vendorPhone || 'غير متوفر'}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${index})">حذف</button>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('mallProducts')) || 
                           JSON.parse(localStorage.getItem('vendorProducts')) || [];
            products.splice(index, 1);
            localStorage.setItem('mallProducts', JSON.stringify(products));
            loadAdminProducts();
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
