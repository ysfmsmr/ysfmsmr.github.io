<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة المول | مول لبنان</title>
  <style>
    :root {
      --primary: #d4a329;
      --dark-bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --danger: #e74c3c;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    header {
      padding: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary);
    }

    h2 { color: var(--primary); margin-bottom: 5px; }

    .admin-card {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin: 10px auto;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: right;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .prod-info {
      flex-grow: 1;
    }

    .prod-title { font-weight: bold; color: var(--primary); font-size: 16px; }
    .prod-meta { color: #aaa; font-size: 13px; margin-top: 4px; }

    .btn-delete {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
    }

    .btn-home {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h2>⚙️ لوحة التحكم وإدارة البضائع</h2>
    <p style="color: #ccc; font-size: 14px;">إدارة وحذف المنتجات المعروضة في مول لبنان</p>
  </header>

  <div id="adminProductsList">
    <!-- المنتجات المضافة ستظهر هنا للمدير -->
  </div>

  <a href="index.html" class="btn-home">⬅️ العودة للرئيسية</a>

  <script>
    function loadAdminProducts() {
      let userProducts = JSON.parse(localStorage.getItem('mall_products') || '[]');
      const container = document.getElementById('adminProductsList');

      if (userProducts.length === 0) {
        container.innerHTML = '<p style="color: #888; margin-top: 30px;">لا يوجد منتجات مضافة من التجار حالياً.</p>';
        return;
      }

      container.innerHTML = userProducts.map((p, index) => `
        <div class="admin-card">
          <div class="prod-info">
            <div class="prod-title">${p.title}</div>
            <div class="prod-meta">المحل: ${p.vendor} | السعر: ${p.price} | القسم: ${p.category}</div>
          </div>
          <button class="btn-delete" onclick="deleteProduct(${index})">🗑️ حذف</button>
        </div>
      `).join('');
    }

    function deleteProduct(index) {
      if (confirm('هل أنت تأكد من رغبتك في حذف هذا المنتج من المول؟')) {
        let userProducts = JSON.parse(localStorage.getItem('mall_products') || '[]');
        userProducts.splice(index, 1);
        localStorage.setItem('mall_products', JSON.stringify(userProducts));
        loadAdminProducts();
        alert('تم حذف المنتج بنجاح!');
      }
    }

    loadAdminProducts();
  </script>

</body>
</html>
