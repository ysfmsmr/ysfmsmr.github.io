<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول لبنان الإلكتروني</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --whatsapp: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        header h1 {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 0;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: right;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            color: var(--text);
            padding: 12px 5px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .vendor-banner {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .big-screen-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .big-screen-card h2 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .product-display {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .product-store {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .product-price {
            color: #2ecc71;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .wa-btn {
            background: var(--whatsapp);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>مول لبنان الإلكتروني</h1>
        </header>

        <!-- حقل البحث -->
        <input type="text" class="search-box" placeholder="ابحث عن قطعة، محل، أو صنف...">

        <!-- أقسام التنقل (مربوطة بأسماء الملفات الصحيحة على المستودع) -->
        <div class="nav-grid">
            <a href="index.html" class="nav-btn">🏠 الرئيسية</a>
            <a href="shop_shoes.html" class="nav-btn">👟 الأحذية</a>
            <a href="shop_perfumes.html" class="nav-btn">💎 العطور</a>
            <a href="shop_clothes.html" class="nav-btn">👕 الألبسة</a>
            <a href="vendor_dashboard.html" class="nav-btn">📦 لوحة التاجر</a>
            <a href="admin_panel.html" class="nav-btn">⚙️ الإدارة</a>
        </div>

        <!-- بانر تسجيل التجار -->
        <a href="register.html" class="vendor-banner">
            ✨ أصحاب المحلات: اضغط هنا للاشتراك والانضمام للمول
        </a>

        <!-- الشاشة العملاقة (العروض المميزة المتحركة) -->
        <div class="big-screen-card">
            <h2>🔥 الشاشة العملاقة: العروض المميزة</h2>
            <div id="bigScreenContainer" class="product-display"></div>
            <a id="bigScreenWaBtn" href="#" target="_blank" class="wa-btn">💬 اطلب الآن عبر الواتساب من المحل</a>
        </div>
    </div>

    <script>
        const featuredProducts = [
            { name: "حذاء رجالي جلد طبيعي فاخر", store: "محل الهرمل للأحذية", price: "25 $", defaultPhone: "96181703239" },
            { name: "عطر عربي مركز يدوم طويلاً", store: "عطور البقاع الملكية", price: "15 $", defaultPhone: "96181703239" },
            { name: "طقم رياضي رجالي شتوي", store: "ألبسة زحلة الحديثة", price: "30 $", defaultPhone: "96181703239" }
        ];

        let currentIndex = 0;

        function updateBigScreen() {
            const container = document.getElementById('bigScreenContainer');
            const waBtn = document.getElementById('bigScreenWaBtn');
            if (!container || !waBtn) return;

            const product = featuredProducts[currentIndex];
            const vendorPhone = localStorage.getItem('vendorWhatsAppNumber') || product.defaultPhone;

            container.innerHTML = `
                <div class="product-title">${product.name}</div>
                <div class="product-store">المحل: ${product.store}</div>
                <div class="product-price">${product.price}</div>
            `;

            const message = encodeURIComponent(`مرحباً، أريد طلب هذا المنتج: ${product.name} (${product.store}) المعروض على الشاشة العملاقة.`);
            waBtn.href = `https://wa.me/${vendorPhone}?text=${message}`;

            currentIndex = (currentIndex + 1) % featuredProducts.length;
        }

        window.onload = function() {
            updateBigScreen();
            setInterval(updateBigScreen, 4000);
        };
    </script>
</body>
</html>
