<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول لبنان | المنصة الرئيسية</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #015d64;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0 0 5px 0;
        }
        header p {
            color: #aaa;
            margin: 0;
            font-size: 0.9rem;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-buttons a {
            flex: 1;
            text-align: center;
            background: var(--accent);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .product-item {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }
        .product-price {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-desc {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .whatsapp-order-btn {
            display: block;
            text-align: center;
            background: #25d366;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <header>
            <h1>مول لبنان</h1>
            <p>منصتك المتكاملة للتسوق والطلب المباشر</p>
        </header>

        <!-- أزرار التنقل بين لوحة التاجر ودخول التجار -->
        <div class="nav-buttons">
            <a href="vendor_dashboard.html">لوحة التاجر</a>
            <a href="vendor_login.html">دخول التجار</a>
        </div>

        <!-- قسم المنتجات المعروضة -->
        <div class="card">
            <h2>المنتجات المتوفرة</h2>
            <div class="product-item">
                <div class="product-title">كنافة بالجبن البلدي الممتاز</div>
                <div class="product-price">السعر: 5$</div>
                <div class="product-desc">كنافة ساخنة ومطمطمة على اصولها مع القطر الساخن.</div>
                <a href="#" class="whatsapp-order-btn" onclick="orderViaWhatsApp('كنافة بالجبن البلدي الممتاز', '5$')">
                    🛒 اطلب عبر الواتساب
                </a>
            </div>
        </div>
    </div>

    <script>
        // دالة ربط الطلب برقم الواتساب المحفوظ للتاجر
        function orderViaWhatsApp(productName, productPrice) {
            const vendorPhone = localStorage.getItem('vendorWhatsAppNumber');

            if (!vendorPhone) {
                alert('عذراً، لم يتم ضبط رقم واتساب للتاجر بعد! يرجى من التاجر تسجيل رقمه في لوحة التحكم أولاً.');
                return;
            }

            const message = `مرحباً، أرغب في طلب المنتج التالي:\n\n📦 المنتج: ${productName}\n💰 السعر: ${productPrice}\n\nيرجى تأكيد الطلب.`;
            const whatsappURL = `https://wa.me/${vendorPhone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
