<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول لبنان الإلكتروني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; padding: 10px; }
        header { padding: 15px; border-bottom: 2px solid #d4af37; margin-bottom: 15px; }
        header h1 { color: #d4af37; font-size: 22px; margin-bottom: 5px; }
        header p { color: #aaa; font-size: 12px; }
        
        .nav-buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .nav-btn { background: #d4af37; color: #111; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .nav-btn-game { background: #ff4757; color: #fff; }
        
        .visitor-counter { background: #fff; color: #111; padding: 10px; border-radius: 8px; font-weight: bold; margin: 15px auto; max-width: 90%; border: 2px solid #d4af37; font-size: 14px; }
        
        .section-title { color: #d4af37; font-size: 15px; margin: 15px 0 10px 0; font-weight: bold; }
        
        .slider-card { background: #000; border: 2px solid #d4af37; border-radius: 12px; max-width: 350px; margin: 0 auto; padding: 15px; box-shadow: 0 4px 15px rgba(212,175,55,0.2); position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: #ff4757; color: #fff; padding: 3px 8px; font-size: 11px; border-radius: 4px; font-weight: bold; z-index: 5; }
        .slide-counter { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #d4af37; padding: 3px 8px; font-size: 11px; border-radius: 4px; border: 1px solid #d4af37; z-index: 5; }
        
        .slider-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .slider-card h3 { color: #d4af37; font-size: 18px; margin-bottom: 5px; }
        .slider-card p { color: #ccc; font-size: 12px; margin-bottom: 8px; }
        .price-box { font-size: 16px; font-weight: bold; color: #2ed573; }
        .old-price { text-decoration: line-through; color: #777; font-size: 13px; margin-right: 5px; }
    </style>
</head>
<body>

<header>
    <h1>🛒 مول لبنان الإلكتروني 🛍️</h1>
    <p>وجهتك الأولى للتسوق والمتاجر الفاخرة</p>
</header>

<div class="nav-buttons">
    <a href="index.html" class="nav-btn">🏠 الرئيسية</a>
    <a href="shop_shoes.html" class="nav-btn">👞 الأحذية</a>
    <a href="shop_perfumes.html" class="nav-btn">💎 العطور</a>
    <a href="lucky_wheel.html" class="nav-btn nav-btn-game">🎡 دولاب الحظ</a>
    <a href="vendor_dashboard.html" class="nav-btn">📦 لوحة التاجر</a>
    <a href="admin_panel.html" class="nav-btn" style="background:#333; color:#fff;">⚙️ الإدارة</a>
</div>

<div class="visitor-counter">
    👀 عدد زوار المول الكلي: <span id="visitorCount">142</span> زائر
</div>

<div class="section-title">
    🔥 أحدث القطع المعروضة من المحلات (تقلب كل 10 ثوانٍ)
</div>

<div class="slider-card" id="sliderContainer">
    <div class="badge">🔥 عرض خاص</div>
    <div class="slide-counter" id="slideIndicator">قطعة (1 من 1)</div>
    <img id="slideImg" src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=500&auto=format&fit=crop&q=60" alt="منتج">
    <h3 id="slideTitle">فستان ★</h3>
    <p id="slideDesc">📍 معروض من أحدث بضائع المحلات والتجار</p>
    <div class="price-box">
        <span class="old-price" id="slideOldPrice">$20</span>
        <span id="slidePrice">$10</span>
    </div>
</div>

<script>
    let vendorItems = JSON.parse(localStorage.getItem('vendorStorage')) || JSON.parse(localStorage.getItem('storeFrontDisplayOnly')) || [];
    
    const defaultProducts = [
        {
            title: "فستان أطفال فخم ★",
            desc: "📍 معروض من أحدث بضائع المحلات والتجار",
            price: "10",
            oldPrice: "20",
            image: "https://images.unsplash.com/photo-1519689680058-324335c77eba?w=500&auto=format&fit=crop&q=60"
        },
        {
            title: "حذاء رجالي جلد فاخر 👞",
            desc: "📍 مصنع خصيصاً لأجل إطلالتك الراسخة",
            price: "25",
            oldPrice: "40",
            image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500&auto=format&fit=crop&q=60"
        }
    ];

    let allProducts = vendorItems.length > 0 ? vendorItems : defaultProducts;
    let currentIndex = 0;

    function updateSlider() {
        if(!allProducts || allProducts.length === 0) return;
        let p = allProducts[currentIndex];
        
        document.getElementById('slideImg').src = p.image || p.thumb || p.img || 'https://via.placeholder.com/300';
        document.getElementById('slideTitle').innerText = p.title || p.name || 'قطعة مميزة';
        document.getElementById('slideDesc').innerText = p.desc || p.description || '📍 معروض من أحدث بضائع المحلات';
        document.getElementById('slidePrice').innerText = p.price ? p.price + ' $' : '';
        document.getElementById('slideOldPrice').innerText = p.oldPrice ? p.oldPrice + ' $' : '';
        document.getElementById('slideIndicator').innerText = `قطعة (${currentIndex + 1} من ${allProducts.length})`;
        
        currentIndex = (currentIndex + 1) % allProducts.length;
    }

    if(allProducts.length > 0) {
        updateSlider();
        setInterval(updateSlider, 10000);
    }
</script>

</body>
</html>
