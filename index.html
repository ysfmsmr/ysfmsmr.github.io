<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول لبنان - Mall Lebanon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; color: #333; direction: rtl; }
        
        /* الهيدر وعنوان المول */
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        header h1 { font-size: 28px; color: #d4af37; margin-bottom: 5px; }
        header p { font-size: 14px; color: #ccc; }

        /* شريط الأقسام */
        .nav-categories { display: flex; justify-content: center; background: #222; padding: 10px; gap: 15px; }
        .nav-categories a { color: #fff; text-decoration: none; padding: 8px 15px; background: #333; border-radius: 5px; font-size: 14px; transition: 0.3s; }
        .nav-categories a:hover { background: #d4af37; color: #111; }

        /* شاشة العرض الكبرى المتقلبة (Slideshow) */
        .slideshow-container { position: relative; max-width: 1000px; margin: 20px auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .slide { display: none; }
        .slide img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 5px; }
        .slide-title { font-size: 18px; font-weight: bold; margin-top: 10px; color: #111; }
        .whatsapp-btn { display: inline-block; margin-top: 10px; background: #25d366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .whatsapp-btn:hover { background: #1ebe5d; }

        /* قسم المحلات المشتركة */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        h2.section-title { font-size: 22px; margin-bottom: 15px; border-bottom: 2px solid #d4af37; padding-bottom: 5px; color: #222; }
        
        .shops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .shop-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 15px; transition: 0.3s; }
        .shop-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .shop-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .shop-card h3 { font-size: 18px; margin-bottom: 5px; color: #111; }
        .shop-card p { font-size: 13px; color: #666; margin-bottom: 10px; }
        .visit-btn { display: inline-block; background: #111; color: #d4af37; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .visit-btn:hover { background: #d4af37; color: #111; }
    </style>
</head>
<body>

    <!-- الهيدر وعنوان المول -->
    <header>
        <h1>مول لبنان</h1>
        <p>بوابتك الأولى لأرقى الألبسة، الأحذية، والعطورات في مكان واحد</p>
    </header>

    <!-- شريط الأقسام -->
    <div class="nav-categories">
        <a href="#clothes">قسم الألبسة</a>
        <a href="#shoes">قسم الأحذية</a>
        <a href="#perfumes">قسم العطورات</a>
    </div>

    <!-- شاشة العرض الكبرى المتقلبة -->
    <div class="slideshow-container">
        <div class="slide">
            <img src="https://via.placeholder.800x350?text=Featured+Item+1" alt="قطعة مميزة">
            <div class="slide-title">محل الفخامة - جاكيت رجالي فاخر</div>
            <a href="https://wa.me/96100000000?text=مرحباً، أرغب بالاستفسار عن هذه القطعة المميزة" class="whatsapp-btn" target="_blank">اطلب الآن عبر واتساب</a>
        </div>
        <div class="slide">
            <img src="https://via.placeholder.800x350?text=Featured+Item+2" alt="قطعة مميزة">
            <div class="slide-title">عطورات الذهب - عطر ملكي خاص</div>
            <a href="https://wa.me/96100000000?text=مرحباً، أرغب بالاستفسار عن هذه القطعة المميزة" class="whatsapp-btn" target="_blank">اطلب الآن عبر واتساب</a>
        </div>
    </div>

    <!-- المحلات المشتركة -->
    <div class="container">
        <h2 class="section-title">المحلات المشتركة في المول</h2>
        <div class="shops-grid" id="shopsList">
            <!-- بطاقة محل تجريبي -->
            <div class="shop-card">
                <img src="https://via.placeholder.300x180?text=Shop+Sample" alt="صورة بضاعة المحل">
                <h3>محل الأناقة للألبسة</h3>
                <p>أرقى الموديلات الحديثة</p>
                <a href="shop_view.html?id=1" class="visit-btn">تصفح المحل</a>
            </div>
        </div>
    </div>

    <script>
        // حركة الشاشة المتقلبة أوتوماتيكياً
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let slides = document.getElementsByClassName("slide");
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}    
            slides[slideIndex-1].style.display = "block";  
            setTimeout(showSlides, 4000); // تتغير كل 4 ثوانٍ
        }
    </script>
</body>
</html>
