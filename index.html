<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول لبنان الإلكتروني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; }

        header { background: #1a1a1a; padding: 15px; border-bottom: 3px solid #d4af37; }
        .nav-links { display: flex; justify-content: center; gap: 8px; padding: 10px; background: #111; flex-wrap: wrap; }
        .nav-links a { background: #d4af37; color: #111; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        .visitors-box { background: #fff; color: #111; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; font-size: 14px; border: 2px solid #d4af37; }

        .section-title { font-size: 18px; color: #d4af37; margin-bottom: 15px; font-weight: bold; }

        /* الكرت الأسود الفخم لعرض القطع المرفوعة */
        .featured-slider-card { background: #000; border: 2px solid #d4af37; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); text-align: center; position: relative; }
        
        .featured-img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #222; border: 1px solid #d4af37; }
        
        .featured-title { color: #d4af37; font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        
        .price-box { margin: 10px 0; font-size: 16px; }
        .old-price { text-decoration: line-through; color: #888; margin-left: 8px; font-size: 14px; }
        .current-price { color: #e74c3c; font-weight: bold; font-size: 18px; }
        .normal-price { color: #2ecc71; font-weight: bold; font-size: 18px; }

        .whatsapp-btn { display: inline-block; width: 100%; padding: 10px; background: #25d366; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; margin-top: 10px; }
        
        .empty-featured { color: #aaa; padding: 30px; font-size: 14px; }

        .categories-section { margin-top: 30px; }
        .category-card { background: #1a1a1a; border: 1px solid #d4af37; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-decoration: none; color: #fff; display: block; }
        .category-card h3 { color: #d4af37; font-size: 16px; margin-bottom: 5px; }
        .category-card p { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1 style="color: #d4af37; font-size: 20px;">🛍️ مول لبنان الإلكتروني</h1>
</header>

<div class="nav-links">
    <a href="index.html">🏠 الرئيسية</a>
    <a href="vendor_dashboard.html">📦 لوحة التاجر</a>
    <a href="admin_panel.html">⚙️ الإدارة</a>
</div>

<div class="container">

    <div class="visitors-box">
        👀 عدد زوار المول الكلي: <span id="visitorCount">135</span> زائر
    </div>

    <div class="section-title">🔥 أبرز القطع والحسومات الفاخرة في المول</div>

    <!-- الكرت الفخم الذي سيعرض المنتجات المرفوعة ديناميكياً -->
    <div class="featured-slider-card" id="featuredContainer">
        <!-- يتم تعبئتها تلقائياً -->
    </div>

    <div class="section-title">أقسام ومتاجر المول</div>
    
    <div class="categories-section">
        <a href="shop_shoes.html" class="category-card">
            <h3>👞 أزياء وأحذية</h3>
            <p>أحدث صيحات الموضة والألبسة والأحذية</p>
        </a>
    </div>

</div>

<script>
    function loadFeaturedProduct() {
        const container = document.getElementById('featuredContainer');
        let products = JSON.parse(localStorage.getItem('vendorProducts')) || [];

        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-featured">
                    لا توجد بضائع مرفوعة حالياً.<br>
                    اذهب إلى <b>"لوحة التاجر"</b> وارفع أول منتج مع صورة ليظهر هنا فوراً! 🚀
                </div>
            `;
            return;
        }

        // جلب أحدث منتج مرفوع
        let latestProd = products[products.length - 1];
        let hasDiscount = latestProd.discountPrice && latestProd.discountPrice < latestProd.price;
        let displayPrice = hasDiscount ? latestProd.discountPrice : latestProd.price;
        let imgSrc = latestProd.image ? latestProd.image : 'https://via.placeholder.com/400x220?text=مول+لبنان';

        let vendorPhone = "96170000000"; 
        let message = encodeURIComponent(`مرحباً، أرغب بطلب قطعة "${latestProd.name}" بسعر ${displayPrice}$`);
        let whatsappUrl = `https://wa.me/${vendorPhone}?text=${message}`;

        container.innerHTML = `
            ${hasDiscount ? '<div style="position:absolute; top:15px; left:15px; background:#e74c3c; color:#fff; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:bold;">🔥 خصم خاص</div>' : ''}
            <img src="${imgSrc}" alt="${latestProd.name}" class="featured-img">
            <div class="featured-title">⭐ ${latestProd.name}</div>
            <div class="price-box">
                ${hasDiscount ? `
                    <span class="old-price">${latestProd.price} $</span>
                    <span class="current-price">${latestProd.discountPrice} $</span>
                ` : `
                    <span class="normal-price">${latestProd.price} $</span>
                `}
            </div>
            <a href="${whatsappUrl}" target="_blank" class="whatsapp-btn">اطلب عبر واتساب 💬</a>
        `;
    }

    window.onload = loadFeaturedProduct;
</script>

</body>
</html>
