<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; color: #333; direction: rtl; }
        
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        header h1 { font-size: 24px; color: #d4af37; margin-bottom: 5px; }

        .container { max-width: 800px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 15px; color: #111; border-bottom: 2px solid #d4af37; padding-bottom: 5px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .upload-btn { background: #d4af37; color: #111; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        .upload-btn:hover { background: #c19b2e; }

        .products-list { margin-top: 30px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ddd; }
        .product-info { display: flex; align-items: center; gap: 10px; }
        .product-info img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
        
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #cc0000; }
        
        .feature-checkbox { margin-right: 10px; font-size: 13px; color: #555; }
    </style>
</head>
<body>

    <header>
        <h1>لوحة تحكم التاجر</h1>
        <p>أضف منتجاتك، تحكم ببضائعك، واعرضها في مول لبنان</p>
    </header>

    <div class="container">
        <h2>إضافة قطعة جديدة من الاستوديو</h2>
        <div class="form-group">
            <label for="productName">اسم القطعة أو المنتج:</label>
            <input type="text" id="productName" placeholder="مثلاً: قميص رجالي فاخر / عطر ملكي">
        </div>
        <div class="form-group">
            <label for="productImage">اختر صورة القطعة من الاستوديو:</label>
            <input type="file" id="productImage" accept="image/*">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="isFeatured" class="feature-checkbox"> عرض هذه القطعة كـ "قطعة مميزة" على شاشة المول الكبرى
            </label>
        </div>
        <button class="upload-btn" onclick="addProduct()">نشر القطعة في متجري</button>

        <div class="products-list">
            <h2>بضائعي المعروضة حالياً</h2>
            <div id="vendorProducts">
                <!-- المنتجات المضافة ستظهر هنا -->
                <div class="product-item">
                    <div class="product-info">
                        <img src="https://via.placeholder.60" alt="منتج">
                        <div>
                            <strong>جاكيت جلد أسود</strong>
                            <p style="font-size: 12px; color: #666;">مميز على الشاشة الكبرى</p>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="this.parentElement.remove()">حذف</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addProduct() {
            let name = document.getElementById('productName').value;
            let imageInput = document.getElementById('productImage');
            let isFeatured = document.getElementById('isFeatured').checked;

            if(name === "") {
                alert("الرجاء إدخال اسم القطعة!");
                return;
            }

            let container = document.getElementById('vendorProducts');
            let item = document.createElement('div');
            item.className = 'product-item';
            
            item.innerHTML = `
                <div class="product-info">
                    <img src="https://via.placeholder.60?text=New" alt="منتج">
                    <div>
                        <strong>${name}</strong>
                        <p style="font-size: 12px; color: #666;">${isFeatured ? 'مميز على الشاشة الكبرى' : 'معروض في المتجر'}</p>
                    </div>
                </div>
                <button class="delete-btn" onclick="this.parentElement.remove()">حذف</button>
            `;
            
            container.appendChild(item);
            document.getElementById('productName').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('isFeatured').checked = false;
            alert("تم نشر القطعة بنجاح في متجرك!");
        }
    </script>
</body>
</html>
