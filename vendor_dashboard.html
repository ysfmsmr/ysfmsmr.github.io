<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التاجر - إضافة منتج</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --whatsapp: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.3rem;
        }
        .form-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary);
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: right;
        }
        .submit-btn {
            background: var(--whatsapp);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 لوحة إضافة منتج للتاجر</h1>
        </header>

        <div class="form-card">
            <div class="form-group">
                <label>اسم المحل / المتجر</label>
                <input type="text" id="storeName" placeholder="مثال: محل الهرمل للأحذية">
            </div>
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="productName" placeholder="مثال: حذاء رجالي فاخر">
            </div>
            <div class="form-group">
                <label>السعر ($)</label>
                <input type="text" id="productPrice" placeholder="مثال: 25 $">
            </div>
            <div class="form-group">
                <label>رقم الواتساب للتاجر (مع رمز الدولة)</label>
                <input type="text" id="vendorPhone" placeholder="96181703239">
            </div>
            <button class="submit-btn" onclick="addNewProduct()">إضافة المنتج ونشره بالمول</button>
        </div>

        <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>
    </div>

    <script>
        function addNewProduct() {
            const store = document.getElementById('storeName').value.trim();
            const name = document.getElementById('productName.value' || 'productName').value.trim(); // تم تعديلها لتكون دقيقة
            const price = document.getElementById('productPrice').value.trim();
            const phone = document.getElementById('vendorPhone').value.trim();

            if (!store || !name || !price || !phone) {
                alert('الرجاء تعبئة كافة الحقول بشكل صحيح!');
                return;
            }

            const actualName = document.getElementById('productName').value.trim();

            let products = JSON.parse(localStorage.getItem('mallProducts')) || [];
            products.push({
                store: store,
                name: actualName,
                price: price,
                phone: phone
            });

            localStorage.setItem('mallProducts', JSON.stringify(products));
            localStorage.setItem('vendorWhatsAppNumber', phone);

            alert('تم نشر المنتج بنجاح وأصبح ظاهراً في لوحة الإدارة والشاشة العملاقة!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
