<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر - مول لبنان الإلكتروني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; }

        header { background: #1a1a1a; padding: 15px; border-bottom: 3px solid #d4af37; }
        
        .nav-links { display: flex; justify-content: center; gap: 8px; padding: 10px; background: #111; flex-wrap: wrap; }
        .nav-links a { background: #d4af37; color: #111; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        .dashboard-box { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 12px; padding: 20px; margin-bottom: 25px; text-align: right; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        
        .form-title { color: #d4af37; font-size: 18px; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; text-align: center; }
        
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #ddd; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
        input:focus, textarea:focus { border-color: #d4af37; outline: none; }

        .submit-btn { background: #d4af37; color: #111; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #c5a028; }

        /* أقسام الإدارة والتحكم */
        .manage-section { margin-top: 25px; text-align: right; }
        .manage-title { color: #d4af37; font-size: 16px; margin-bottom: 12px; font-weight: bold; border-right: 4px solid #d4af37; padding-right: 8px; }
        
        .manage-item-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .manage-item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .manage-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #d4af37; flex-shrink: 0; background: #111; }
        .manage-details h4 { color: #fff; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .manage-details p { color: #d4af37; font-size: 12px; }

        .action-btns { display: flex; gap: 5px; flex-shrink: 0; }
        .show-btn { background: #27ae60; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .show-btn:hover { background: #219653; }
        
        .remove-btn { background: #e67e22; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .remove-btn:hover { background: #d35400; }

        .delete-btn { background: #c0392b; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .delete-btn:hover { background: #962d22; }

        .empty-msg { color: #888; font-size: 13px; text-align: center; padding: 15px; background: #1a1a1a; border-radius: 6px; border: 1px dashed #444; }
    </style>
</head>
<body>

<header>
    <h1 style="color: #d4af37; font-size: 18px;">📦 لوحة تحكم التاجر</h1>
    <p style="color: #aaa; font-size: 11px; margin-top: 2px;">إدارة المخزن وشاشة العرض في مول لبنان الفخم</p>
</header>

<div class="nav-links">
    <a href="index.html">🏠 الرئيسية</a>
    <a href="shop_shoes.html">👞 الأحذية</a>
    <a href="vendor_dashboard.html">📦 لوحة التاجر</a>
    <a href="admin_panel.html">⚙️ الإدارة</a>
</div>

<div class="container">

    <!-- نموذج إضافة بضاعة لصندوق المتجر فقط (بدون نشر تلقائي) -->
    <div class="dashboard-box">
        <div class="form-title">إضافة بضاعة جديدة لصندوق المتجر</div>
        
        <label>اسم المنتج أو البضاعة:</label>
        <input type="text" id="productName" placeholder="مثال: فستان سهرة فخم / حذاء رياضي">

        <label>السعر الأساسي ($):</label>
        <input type="number" id="productPrice" placeholder="مثال: 50">

        <label>سعر الخصم (اختياري - اتركه فارغاً إذا لم يوجد):</label>
        <input type="number" id="discountPrice" placeholder="مثال: 40">

        <label>صورة المنتج من جهازك أو هاتفك:</label>
        <input type="file" id="productImage" accept="image/*">

        <button class="submit-btn" onclick="addNewProductToStorage()">إضافة لصندوق المتجر 📦</button>
    </div>

    <!-- قسم القطع المعروضة حالياً على واجهة المول -->
    <div class="manage-section">
        <div class="manage-title">🖥️ القطع المعروضة حالياً على الشاشة الرئيسية</div>
        <div id="activeDisplayList">
            <!-- تعبئة تلقائية -->
        </div>
    </div>

    <!-- قسم صندوق بضائع التاجر المخزنة -->
    <div class="manage-section" style="margin-top: 35px;">
        <div class="manage-title">🗄️ صندوق بضائعي (المخزن داخل المتجر)</div>
        <div id="vendorStorageList">
            <!-- تعبئة تلقائية -->
        </div>
    </div>

</div>

<script>
    function loadVendorDashboard() {
        let storageProducts = JSON.parse(localStorage.getItem('vendorStorage')) || [];
        let activeProducts = JSON.parse(localStorage.getItem('vendorProducts')) || [];

        let storageContainer = document.getElementById('vendorStorageList');
        let activeContainer = document.getElementById('activeDisplayList');

        // 1. عرض القطع المعروضة حالياً بالواجهة
        if (activeProducts.length === 0) {
            activeContainer.innerHTML = `<div class="empty-msg">لا توجد قطع معروضة حالياً على الشاشة الرئيسية. اختر قطعة من صندوقك أدناه واعرضها!</div>`;
        } else {
            let activeHtml = '';
            activeProducts.forEach((prod, index) => {
                let img = prod.image ? prod.image : 'https://via.placeholder.com/50?text=صورة';
                let displayPrice = prod.discountPrice ? `${prod.discountPrice}$ (بدل ${prod.price}$)` : `${prod.price}$`;
                
                activeHtml += `
                    <div class="manage-item-card" style="border-color: #d4af37;">
                        <div class="manage-item-info">
                            <img src="${img}" alt="${prod.name}" class="manage-thumb">
                            <div class="manage-details">
                                <h4>${prod.name}</h4>
                                <p>السعر: ${displayPrice}</p>
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeFromActive(${index})">إزالة من العرض ⏹️</button>
                    </div>
                `;
            });
            activeContainer.innerHTML = activeHtml;
        }

        // 2. عرض صندوق البضائع المخزنة
        if (storageProducts.length === 0) {
            storageContainer.innerHTML = `<div class="empty-msg">صندوقك فارغ حالياً. أضف بضاعة جديدة من النموذج بالأعلـى!</div>`;
            return;
        }

        let storageHtml = '';
        storageProducts.forEach((prod, index) => {
            let img = prod.image ? prod.image : 'https://via.placeholder.com/50?text=صورة';
            let displayPrice = prod.discountPrice ? `${prod.discountPrice}$ (بدل ${prod.price}$)` : `${prod.price}$`;
            
            storageHtml += `
                <div class="manage-item-card">
                    <div class="manage-item-info">
                        <img src="${img}" alt="${prod.name}" class="manage-thumb">
                        <div class="manage-details">
                            <h4>${prod.name}</h4>
                            <p>السعر: ${displayPrice}</p>
                        </div>
                    </div>
                    <div class="action-btns">
                        <button class="show-btn" onclick="sendToDisplay(${index})">عرض 🖥️</button>
                        <button class="delete-btn" onclick="deleteFromStorage(${index})">حذف 🗑️</button>
                    </div>
                </div>
            `;
        });
        storageContainer.innerHTML = storageHtml;
    }

    function addNewProductToStorage() {
        let name = document.getElementById('productName').value.trim();
        let price = document.getElementById('productPrice').value.trim();
        let discountPrice = document.getElementById('discountPrice').value.trim();
        let imageInput = document.getElementById('productImage');

        if (!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر الأساسي على الأقل!');
            return;
        }

        if (imageInput.files && imageInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                saveToStorage(name, price, discountPrice, e.target.result);
            };
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            saveToStorage(name, price, discountPrice, '');
        }
    }

    function saveToStorage(name, price, discountPrice, image) {
        let storageProducts = JSON.parse(localStorage.getItem('vendorStorage')) || [];
        
        let newProd = {
            name: name,
            price: price,
            discountPrice: discountPrice,
            image: image
        };

        storageProducts.push(newProd);
        localStorage.setItem('vendorStorage', JSON.stringify(storageProducts));

        alert('تم حفظ المنتج في صندوق متجرك بنجاح (دون نشر تلقائي)! 📦');
        
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('discountPrice').value = '';
        document.getElementById('productImage').value = '';
        
        loadVendorDashboard();
    }

    // نقل القطعة من الصندوق إلى الشاشة الرئيسية عند الضغط حصراً على زر "عرض 🖥️"
    function sendToDisplay(index) {
        let storageProducts = JSON.parse(localStorage.getItem('vendorStorage')) || [];
        let activeProducts = JSON.parse(localStorage.getItem('vendorProducts')) || [];

        let selectedProduct = storageProducts[index];
        
        activeProducts.push(selectedProduct);
        localStorage.setItem('vendorProducts', JSON.stringify(activeProducts));

        alert('تم اختيار القطعة ونشرها على الشاشة الرئيسية بنجاح! 🚀');
        loadVendorDashboard();
    }

    // إزالة القطعة من الشاشة الرئيسية فقط
    function removeFromActive(index) {
        let activeProducts = JSON.parse(localStorage.getItem('vendorProducts')) || [];
        activeProducts.splice(index, 1);
        localStorage.setItem('vendorProducts', JSON.stringify(activeProducts));
        loadVendorDashboard();
        alert('تم إزالة القطعة من الشاشة الرئيسية فقط، وهي محفوظة بصندوقك.');
    }

    // حذف نهائي من الصندوق
    function deleteFromStorage(index) {
        if (confirm('هل أنت متأكد من رغبتك في حذف هذه القطعة نهائياً من صندوق متجرك؟')) {
            let storageProducts = JSON.parse(localStorage.getItem('vendorStorage')) || [];
            storageProducts.splice(index, 1);
            localStorage.setItem('vendorStorage', JSON.stringify(storageProducts));
            loadVendorDashboard();
            alert('تم حذف القطعة نهائياً من الصندوق.');
        }
    }

    window.onload = loadVendorDashboard;
</script>

</body>
</html>
