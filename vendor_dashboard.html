<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التاجر | مول لبنان</title>
  <style>
    :root {
      --primary: #d4a329;
      --dark-bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #15d664;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid var(--primary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h2 {
      color: var(--primary);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #ccc;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      background: linear-gradient(135deg, #d4a329, #f3e08c);
      color: #000;
      border: none;
      padding: 12px 20px;
      width: 100%;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    .btn-back {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📦 لوحة إضافة منتجات التاجر</h2>
    
    <form id="productForm">
      <div class="form-group">
        <label>اسم المحل / التاجر:</label>
        <input type="text" id="vendorName" placeholder="مثال: عطورات الهرمل" required>
      </div>

      <div class="form-group">
        <label>رقم الواتساب الخاص بالمحل (مع رمز الدولة):</label>
        <input type="tel" id="vendorPhone" placeholder="مثال: 96181703239" required>
      </div>

      <div class="form-group">
        <label>عنوان القطعة / المنتج:</label>
        <input type="text" id="prodTitle" placeholder="مثال: عطر تركيب خاص" required>
      </div>

      <div class="form-group">
        <label>القسم:</label>
        <select id="prodCategory">
          <option value="shoes">الأحذية والجلديات</option>
          <option value="perfumes">العطور والمستحضرات</option>
          <option value="clothes">الألبسة والفساتين</option>
        </select>
      </div>

      <div class="form-group">
        <label>السعر الأساسي ($):</label>
        <input type="text" id="prodPrice" placeholder="مثال: 15$" required>
      </div>

      <div class="form-group">
        <label>السعر قبل الخصم (اختياري):</label>
        <input type="text" id="prodOldPrice" placeholder="مثال: 25$">
      </div>

      <div class="form-group">
        <label>رابط صورة المنتج (URL):</label>
        <input type="url" id="prodImg" placeholder="https://..." required>
      </div>

      <button type="submit">✨ نشر القطعة في المول فوراً</button>
    </form>

    <a href="index.html" class="btn-back">⬅️ العودة للرئيسية</a>
  </div>

  <script>
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newProd = {
        title: document.getElementById('prodTitle').value,
        vendor: document.getElementById('vendorName').value,
        phone: document.getElementById('vendorPhone').value,
        category: document.getElementById('prodCategory').value,
        price: document.getElementById('prodPrice').value,
        oldPrice: document.getElementById('prodOldPrice').value,
        img: document.getElementById('prodImg').value,
        wa: "https://wa.me/" + document.getElementById('vendorPhone').value.replace('+', '') + "?text=" + encodeURIComponent("مرحباً، أرغب في شراء " + document.getElementById('prodTitle').value + " المعروضة في مول لبنان")
      };

      let products = JSON.parse(localStorage.getItem('mall_products') || '[]');
      products.push(newProd);
      localStorage.setItem('mall_products', JSON.stringify(products));

      alert('تم إضافة منتجك بنجاح وسيطهر فوراً في قسمه وفي الشاشة العملاقة!');
      this.reset();
    });
  </script>

</body>
</html>
