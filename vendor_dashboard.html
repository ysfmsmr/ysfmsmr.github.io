<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر - مول لبنان الإلكتروني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; }

        header { background: #1a1a1a; padding: 15px; border-bottom: 3px solid #d4af37; }
        
        .nav-links { display: flex; justify-content: center; gap: 8px; padding: 10px; background: #111; flex-wrap: wrap; }
        .nav-links a { background: #d4af37; color: #111; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        .dashboard-box { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 12px; padding: 20px; margin-bottom: 25px; text-align: right; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        
        .form-title { color: #d4af37; font-size: 18px; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; text-align: center; }
        
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #ddd; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
        input:focus, textarea:focus { border-color: #d4af37; outline: none; }

        .submit-btn { background: #d4af37; color: #111; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #c5a028; }

        /* قسم إدارة الحذف والتبديل المرتب */
        .products-manage-section { margin-top: 30px; text-align: right; }
        .manage-title { color: #d4af37; font-size: 16px; margin-bottom: 12px; font-weight: bold; border-right: 4px solid #d4af37; padding-right: 8px; }
        
        .manage-item-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .manage-item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .manage-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #d4af37; flex-shrink: 0; background: #111; }
        .manage-details h4 { color: #fff; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .manage-details p { color: #d4af37; font-size: 12px; }

        .delete-btn { background: #e74c3c; color: #fff; border: none; padding: 7px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .delete-btn:hover { background: #c0392b; }

        .empty-msg { color: #888; font-size: 13px; text-align: center; padding: 15px; background: #1a1a1a; border-radius: 6px; border: 1px dashed #444; }
    </style>
</head>
<body>

<header>
    <h1 style="color: #d4af37; font-size: 18px;">📦 لوحة تحكم التاجر</h1>
    <p style="color: #aaa; font-size: 11px; margin-top: 2px;">إدارة منتجات العرض في مول لبنان الفخم</p>
</header>

<div class="nav-links">
    <a href="index.html">🏠 الرئيسية</a>
    <a href="shop_shoes.html">👞 الأحذية</a>
    <a href="vendor_dashboard.html">📦 لوحة التاجر</a>
    <a href="admin_panel.html">⚙️ الإدارة</a>
</div>

<div class="container">

    <div class="dashboard-box">
        <div class="form-title">إضافة بضاعة جديدة للمول</div>
        
        <label>اسم المنتج أو البضاعة:</label>
        <input type="text" id="productName" placeholder="مثال: فستان سهرة فخم / حذاء رياضي">

        <label>السعر الأساسي ($):</label>
        <input type="number" id="productPrice" placeholder="مثال: 50">

        <label>سعر الخصم (اختياري - اتركه فارغاً إذا لم يوجد):</label>
        <input type="number" id="discountPrice" placeholder="مثال: 40">

        <label>صورة المنتج من جهازك أو هاتفك:</label>
        <input type="file" id="productImage" accept="image/*">

        <button class="submit-btn" onclick="addNewProduct()">نشر المنتج في المول 🚀</button>
    </div>

    <div class="products-manage-section">
        <div class="manage-title">📋 بضائعي الحالية في شاشة العرض (الإدارة والحذف)</div>
        <div id="vendorProductsList">
            </div>
    </div>

</div>

<script>
    function loadVendorProducts() {
        let products = JSON.parse(localStorage.getItem('vendorProducts')) || [];
        let listContainer = document.getElementById('vendorProductsList');

        if (products.length === 0) {
            listContainer.innerHTML = `<div class="empty-msg">لا توجد بضائع مرفوعة حالياً. ارفع منتجك الأول ليظهر بالمول!</div>`;
            return;
        }

        let html = '';
        products.forEach((prod, index) => {
            let img = prod.image ? prod.image : 'https://via.placeholder.com/50?text=صورة';
            let displayPrice = prod.discountPrice ? `${prod.discountPrice}$ (بدل ${prod.price}$)` : `${prod.price}$`;
            
            html += `
                <div class="manage-item-card">
                    <div class="manage-item-info">
                        <img src="${img}" alt="${prod.name}" class="manage-thumb">
                        <div class="manage-details">
                            <h4>${prod.name}</h4>
                            <p>السعر: ${displayPrice}</p>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${index})">حذف 🗑️</button>
                </div>
            `;
        });

        listContainer.innerHTML = html;
    }

    function addNewProduct() {
        let name = document.getElementById('productName').value.trim();
        let price = document.getElementById('productPrice').value.trim();
        let discountPrice = document.getElementById('discountPrice').value.trim();
        let imageInput = document.getElementById('productImage');

        if (!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر الأساسي على الأقل!');
            return;
        }

        if (imageInput.files && imageInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                saveProductToStorage(name, price, discountPrice, e.target.result);
            };
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            // إذا لم يختار صورة، يتم حفظ المنتج بدون صورة أو بصورة افتراضية
            saveProductToStorage(name, price, discountPrice, '');
        }
    }

    function saveProductToStorage(name, price, discountPrice, image) {
        let products = JSON.parse(localStorage.getItem('vendorProducts')) || [];
        
        let newProd = {
            name: name,
            price: price,
            discountPrice: discountPrice,
            image: image
        };

        products.push(newProd);
        localStorage.setItem('vendorProducts', JSON.stringify(products));

        alert('تم نشر المنتج بنجاح في المول وسيظهر على شاشة العرض تلقائياً! 🎉');
        
        // تفريغ الحقول وتحديث القائمة
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('discountPrice').value = '';
        document.getElementById('productImage').value = '';
        
        loadVendorProducts();
    }

    function deleteProduct(index) {
        if (confirm('هل أنت متأكد من رغبتك في حذف هذه القطعة وإزالتها من العرض؟')) {
            let products = JSON.parse(localStorage.getItem('vendorProducts')) || [];
            products.splice(index, 1);
            localStorage.setItem('vendorProducts', JSON.stringify(products));
            loadVendorProducts();
            alert('تم حذف القطعة وإزالتها من الشاشة الرئيسية بنجاح.');
        }
    }

    // تحميل القائمة فور فتح الصفحة
    window.onload = loadVendorProducts;
</script>

</body>
</html>
