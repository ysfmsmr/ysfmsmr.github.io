<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر | مول لبنان v2</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #015d64;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0 0 5px 0;
        }
        header p {
            color: #aaa;
            margin: 0;
            font-size: 0.9rem;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 0.9rem;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: right;
        }
        .save-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: #000;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>لوحة تحكم التاجر - مول لبنان</h1>
            <p>إدارة بيانات المتجر ورقم الواتساب لاستقبال الطلبات</p>
        </header>

        <div class="card">
            <h2>📝 بيانات المتجر والاتصال</h2>
            
            <div class="form-group">
                <label for="storeName">اسم المحل أو المتجر:</label>
                <input type="text" id="storeName" placeholder="مثال: محل الهرمل للأحذية">
            </div>

            <div class="form-group">
                <label for="storeCity">المنطقة في البقاع:</label>
                <select id="storeCity">
                    <option value="الهرمل">الهرمل</option>
                    <option value="بعلبك">بعلبك</option>
                    <option value="زحلة">زحلة</option>
                </select>
            </div>

            <div class="form-group">
                <label for="whatsappNumber">رقم الواتساب (مثال: 96170123456):</label>
                <input type="text" id="whatsappNumber" placeholder="961xxxxxxxx">
            </div>

            <button class="save-btn" onclick="saveVendorData()">حفظ بيانات التاجر</button>
        </div>

        <a href="index.html" class="back-btn">⬅️ العودة إلى الصفحة الرئيسية للمول</a>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('whatsappNumber').value = localStorage.getItem('vendorWhatsAppNumber') || '';
            document.getElementById('storeName').value = localStorage.getItem('vendorStoreName') || '';
            document.getElementById('storeCity').value = localStorage.getItem('vendorCity') || 'الهرمل';
        };

        function saveVendorData() {
            const storeName = document.getElementById('storeName').value.trim();
            const storeCity = document.getElementById('storeCity').value;
            const whatsappNumber = document.getElementById('whatsappNumber').value.trim();
            
            if (!storeName || !whatsappNumber) {
                alert('الرجاء إدخال اسم المحل ورقم الواتساب!');
                return;
            }

            localStorage.setItem('vendorStoreName', storeName);
            localStorage.setItem('vendorCity', storeCity);
            localStorage.setItem('vendorWhatsAppNumber', whatsappNumber);

            alert('✅ تم حفظ بيانات التاجر بنجاح!');
        }
    </script>
</body>
</html>
