<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر | مول لبنان</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #015d64;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
            margin: 0;
        }
        .logout-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
        button.action-btn {
            background: linear-gradient(135deg, var(--primary), #b3892c);
            color: black;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .whatsapp-support {
            display: block;
            text-align: center;
            background: #25d366;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <header>
            <h1>لوحة تحكم التاجر</h1>
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </header>

        <!-- قسم إعدادات التاجر ورقم الواتساب -->
        <div class="card">
            <h2>إعدادات التواصل (رقم الواتساب)</h2>
            <div class="form-group">
                <label>رقم الواتساب الخاص بك (مع رمز الدولة، مثلاً: 96170123456)</label>
                <input type="text" id="vendorWhatsApp" placeholder="أدخل رقم الواتساب لاستقبال طلبات الزبائن">
            </div>
            <button class="action-btn" onclick="saveWhatsAppNumber()">حفظ رقم الواتساب</button>
        </div>

        <!-- قسم إضافة منتج جديد -->
        <div class="card">
            <h2>إضافة منتج جديد لمتجرك</h2>
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="productName" placeholder="مثال: كنافة بالجبن البلدي">
            </div>
            <div class="form-group">
                <label>السعر ($ أو ليرة)</label>
                <input type="text" id="productPrice" placeholder="أدخل السعر">
            </div>
            <div class="form-group">
                <label>وصف المنتج</label>
                <textarea id="productDesc" rows="3" placeholder="تفاصيل المنتج..."></textarea>
            </div>
            <button class="action-btn" onclick="addProduct()">حفظ ونشر المنتج</button>
        </div>

        <!-- قسم الطلبات الواردة -->
        <div class="card">
            <h2>الطلبات الواردة لمتجرك</h2>
            <p id="noOrders" style="color: #aaa; text-align: center;">لا توجد طلبات جديدة حالياً.</p>
            <div id="ordersList"></div>
        </div>

        <!-- زر الدعم الفني عبر واتساب -->
        <a href="https://wa.me/961XXXXXXXX" target="_blank" class="whatsapp-support">
            💬 تواصل مع الدعم الفني لمول لبنان
        </a>
    </div>

    <script>
        // استرجاع الرقم المحفوظ مسبقاً عند فتح الصفحة
        window.onload = function() {
            const savedNumber = localStorage.getItem('vendorWhatsAppNumber');
            if (savedNumber) {
                document.getElementById('vendorWhatsApp').value = savedNumber;
            }
        }

        // حفظ رقم الواتساب في ذاكرة المتصفح مؤقتاً لحين ربطه بقاعدة البيانات
        function saveWhatsAppNumber() {
            const phone = document.getElementById('vendorWhatsApp').value;
            if(!phone) {
                alert('الرجاء إدخال رقم الواتساب أولاً!');
                return;
            }
            localStorage.setItem('vendorWhatsAppNumber', phone);
            alert('تم حفظ رقم الواتساب بنجاح! سيتم تحويل طلبات الزبائن إليه تلقائياً.');
        }

        function addProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const vendorPhone = localStorage.getItem('vendorWhatsAppNumber');
            
            if(!name || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
                return;
            }
            if(!vendorPhone) {
                alert('تنبيه: يرجى حفظ رقم الواتساب الخاص بك في الأعلى أولاً لكي يتمكن الزبائن من مراسلتك!');
                return;
            }

            alert('تمت إضافة المنتج بنجاح وجاهز لعرضه مع رابط واتساب الخاص بك!');
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDesc').value = '';
        }

        function logout() {
            window.location.href = 'vendor_login.html';
        }
    </script>
</body>
</html>
