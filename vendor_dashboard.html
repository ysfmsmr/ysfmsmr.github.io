<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التاجر | مول لبنان</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #015d64;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        header {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0 0 5px 0;
        }
        header p {
            color: #aaa;
            margin: 0;
            font-size: 0.9rem;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 0.9rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: right;
        }
        .save-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: #000;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <header>
            <h1>لوحة تحكم التاجر</h1>
            <p>إدارة إعدادات المتجر ورقم الواتساب لاستقبال الطلبات</p>
        </header>

        <!-- بطاقة إعدادات الواتساب -->
        <div class="card">
            <h2>📱 إعدادات رقم الواتساب</h2>
            <div class="form-group">
                <label for="whatsappNumber">رقم الواتساب الخاص بك (مع رمز الدولة، مثلاً: 96170123456)</label>
                <input type="text" id="whatsappNumber" placeholder="أدخل رقمك هنا...">
            </div>
            <button class="save-btn" onclick="saveVendorWhatsApp()">حفظ رقم الواتساب</button>
        </div>

        <!-- زر العودة للرئيسية -->
        <a href="index.html" class="back-btn">⬅️ العودة إلى الصفحة الرئيسية للمول</a>
    </div>

    <script>
        // استرجاع الرقم المحفوظ مسبقاً لعرضه في الخانة عند فتح الصفحة
        window.onload = function() {
            const savedPhone = localStorage.getItem('vendorWhatsAppNumber');
            if (savedPhone) {
                document.getElementById('whatsappNumber').value = savedPhone;
            }
        };

        // دالة حفظ رقم الواتساب في الـ localStorage
        function saveVendorWhatsApp() {
            const phoneInput = document.getElementById('whatsappNumber').value.trim();
            
            if (!phoneInput) {
                alert('الرجاء إدخال رقم واتساب صحيح!');
                return;
            }

            // تخزين الرقم
            localStorage.setItem('vendorWhatsAppNumber', phoneInput);
            alert('✅ تم حفظ رقم الواتساب بنجاح! سيتم تحويل طلبات الزبائن مباشرة إلى هذا الرقم.');
        }
    </script>
</body>
</html>
