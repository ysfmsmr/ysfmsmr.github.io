<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الألبسة | مول لبنان</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #25d366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        header {
            padding: 10px;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .title {
            font-size: 14px;
            margin: 8px 0 4px;
            font-weight: bold;
        }

        .vendor-name {
            font-size: 11px;
            color: #aaa;
        }

        .price {
            color: var(--accent);
            font-weight: bold;
            margin: 5px 0;
        }

        .btn-wa {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 8px;
            display: block;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>

    <header>
        <h2 style="color: var(--primary); margin: 0;">👗 قسم الألبسة والتشكيلات</h2>
    </header>

    <div class="products-grid">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=500" alt="فستان">
            <div class="title">فستان سهرة فاخر</div>
            <div class="vendor-name">📍 بوتيك الأناقة - زحلة</div>
            <div class="price">$70</div>
            <a href="https://wa.me/96170000000?text=مرحبا،%20اريد%20الاستفسار%20عن%20فستان%20السهرة" class="btn-wa" target="_blank">💬 اطلب عبر الواتساب</a>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="تيشيرت">
            <div class="title">طقم سبور رجالي</div>
            <div class="vendor-name">📍 محلات الملوك - بعلبك</div>
            <div class="price">$25</div>
            <a href="https://wa.me/96170000000?text=مرحبا،%20اريد%20الاستفسار%20عن%20اللقم%20الرجالي" class="btn-wa" target="_blank">💬 اطلب عبر الواتساب</a>
        </div>
    </div>

</body>
</html>
