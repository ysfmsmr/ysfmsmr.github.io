<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محل الأناقة للملابس - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f9f9f9; color: #222; }
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 3px solid #d4af37; }
        header h1 { color: #d4af37; font-size: 26px; margin-bottom: 5px; }
        .back-btn { display: inline-block; margin-top: 10px; padding: 6px 15px; background: #d4af37; color: #111; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
        .section-title { font-size: 20px; font-weight: bold; color: #111; margin-bottom: 20px; border-right: 5px solid #d4af37; padding-right: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.06); border: 1px solid #eee; text-align: center; padding-bottom: 15px; }
        .product-img { width: 100%; height: 180px; background: #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 45px; color: #777; }
        .product-name { font-size: 16px; font-weight: bold; color: #111; margin: 12px 0 5px 0; }
        .product-price { font-size: 15px; color: #d4af37; font-weight: bold; margin-bottom: 12px; }
        .btn-whatsapp { display: inline-block; width: 85%; padding: 8px; background: #25d366; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .btn-whatsapp:hover { background: #1ebe5d; }
    </style>
</head>
<body>
    <header>
        <h1>👔 محل الأناقة للملابس</h1>
        <p>أرقى الموديلات العصرية والشبابية في لبنان</p>
        <a href="index.html" class="back-btn">← العودة إلى الرئيسية للمول</a>
    </header>
    <div class="container">
        <h2 class="section-title">تشكيلة الألبسة المتوفرة</h2>
        <div class="products-grid">
            <div class="product-card">
                <div class="product-img">🧥</div>
                <div class="product-name">جاكيت شتوي فخم</div>
                <div class="product-price">$45.00</div>
                <a href="https://wa.me/96100000000?text=مرحباً، أهتم بشراء جاكيت شتوي فخم من محل الأناقة" class="btn-whatsapp" target="_blank">اطلب عبر واتساب 💬</a>
            </div>
            <div class="product-card">
                <div class="product-img">👕</div>
                <div class="product-name">قميص رجالي رسمي</div>
                <div class="product-price">$20.00</div>
                <a href="https://wa.me/96100000000?text=مرحباً، أهتم بشراء قميص رجالي رسمي من محل الأناقة" class="btn-whatsapp" target="_blank">اطلب عبر واتساب 💬</a>
            </div>
            <div class="product-card">
                <div class="product-img">👖</div>
                <div class="product-name">بنطال جينز عصري</div>
                <div class="product-price">$25.00</div>
                <a href="https://wa.me/96100000000?text=مرحباً، أهتم بشراء بنطال جينز عصري من محل الأناقة" class="btn-whatsapp" target="_blank">اطلب عبر واتساب 💬</a>
            </div>
        </div>
    </div>
</body>
</html>
