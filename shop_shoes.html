<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الأحذية - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; color: #333; direction: rtl; }
        
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        header h1 { font-size: 26px; color: #d4af37; margin-bottom: 5px; }
        header p { font-size: 14px; color: #ccc; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        h2.shop-title { font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #d4af37; padding-bottom: 5px; color: #222; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 15px; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .product-card h3 { font-size: 18px; margin-bottom: 5px; color: #111; }
        .product-card p { font-size: 14px; color: #666; margin-bottom: 15px; }
        
        .whatsapp-btn { display: inline-block; background: #25d366; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; width: 100%; }
        .whatsapp-btn:hover { background: #1ebe5d; }
    </style>
</head>
<body>

    <header>
        <h1>قسم الأحذية - مول لبنان</h1>
        <p>أرقى الموديلات والاحذية الرياضية والرسمية من مختلف المتاجر</p>
    </header>

    <div class="container">
        <h2 class="shop-title">منتجات الأحذية المتوفرة</h2>
        <div class="products-grid">
            
            <div class="product-card">
                <img src="https://via.placeholder.300x200?text=Shoes+1" alt="صورة الحذاء">
                <h3>حذاء رياضي أنيق مريح</h3>
                <p>السعر: 35$</p>
                <a href="https://wa.me/96100000000?text=مرحباً، أرغب بالاستفسار عن هذا الحذاء: حذاء رياضي أنيق مريح" class="whatsapp-btn" target="_blank">اطلب عبر واتساب</a>
            </div>

        </div>
    </div>

</body>
</html>
