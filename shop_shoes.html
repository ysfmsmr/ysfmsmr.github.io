<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قسم الأحذية والجلديات | مول لبنان</title>
  <style>
    :root {
      --primary: #d4a329;
      --dark-bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #15d664;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    header {
      padding: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary);
    }

    h2 { color: var(--primary); margin-bottom: 5px; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .prod-card {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .prod-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .prod-title { font-size: 18px; font-weight: bold; margin: 10px 0 5px 0; }
    .vendor-title { color: #aaa; font-size: 13px; margin-bottom: 10px; }
    .price-tag { color: var(--accent); font-size: 18px; font-weight: bold; }
    
    .btn-wa {
      background-color: var(--accent);
      color: #fff;
      display: block;
      padding: 10px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .btn-home {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h2>👟 قسم الأحذية والجلديات</h2>
    <p style="color: #ccc; font-size: 14px;">أحدث تشكيلة أحذية من أرقى المحلات في المنطقة</p>
  </header>

  <div class="products-grid" id="shoesGrid">
    <!-- المنتجات ستظهر هنا تلقائياً -->
  </div>

  <a href="index.html" class="btn-home">⬅️ العودة للرئيسية</a>

  <script>
    const defaultShoes = [
      {
        title: "حذاء رجالي جلد طبيعي",
        vendor: "محل الهرمل للأحذية",
        price: "25$",
        img: "https://via.placeholder.com/300x200/d4a329/000000?text=حذاء+رجالي",
        wa: "https://wa.me/96181703239?text=" + encodeURIComponent("مرحباً، أرغب في شراء حذاء رجالي جلد طبيعي من مول لبنان")
      }
    ];

    let userProducts = JSON.parse(localStorage.getItem('mall_products') || '[]');
    let shoeProducts = userProducts.filter(p => p.category === 'shoes').concat(defaultShoes);

    const grid = document.getElementById('shoesGrid');
    grid.innerHTML = shoeProducts.map(p => `
      <div class="prod-card">
        <img src="${p.img}" class="prod-img" alt="${p.title}">
        <div class="prod-title">${p.title}</div>
        <div class="vendor-title">المحل: ${p.vendor}</div>
        <div class="price-tag">${p.price}</div>
        <a href="${p.wa}" target="_blank" class="btn-wa">💬 اطلب عبر الواتساب</a>
      </div>
    `).join('');
  </script>

</body>
</html>
