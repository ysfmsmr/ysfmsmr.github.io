<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول لبنان - تسجيل دخول التجار</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219653; }
        #error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>دخول تجار مول لبنان</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">البريد الإلكتروني للتاجر</label>
                <input type="email" id="email" required placeholder="vendor@lebanonmall.com">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">دخول لوحة التحكم</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <!-- سكربت جافاسكريبت وربط الفايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        // مفاتيح مشروعك السحابي
        const firebaseConfig = {
          apiKey: "AIzaSyBa8srb1CogFiLTHNDZ0r5uRRzdziwOVlg",
          authDomain: "mall-lebanon.firebaseapp.com",
          projectId: "mall-lebanon",
          storageBucket: "mall-lebanon.appspot.com",
          messagingSenderId: "1063802042997",
          appId: "1:1063802042997:web:8922f193675552d73a163c"
        };

        // تهيئة الفايربيس
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // التعامل مع نموذج تسجيل الدخول
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                alert("تم تسجيل الدخول بنجاح! أهلاً بك يا تاجر: " + userCredential.user.email);
            } catch (error) {
                errorMsg.textContent = "خطأ في البريد الإلكتروني أو كلمة المرور: " + error.message;
            }
        });
    </script>
</body>
</html>
