<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول التاجر - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; color: #333; direction: rtl; }
        
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        header h1 { font-size: 26px; color: #d4af37; margin-bottom: 5px; }

        .container { max-width: 400px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 20px; color: #111; text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .login-btn { background: #111; color: #d4af37; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .login-btn:hover { background: #d4af37; color: #111; }
    </style>
</head>
<body>

    <header>
        <h1>دخول التجار</h1>
        <p>سجل دخولك لإدارة منتجاتك ومتابعة متجرك</p>
    </header>

    <div class="container">
        <h2>تسجيل الدخول للوحة التحكم</h2>
        <div class="form-group">
            <label for="loginPhone">رقم الواتساب المسجل:</label>
            <input type="text" id="loginPhone" placeholder="مثلاً: 96170000000+">
        </div>
        <div class="form-group">
            <label for="loginPass">كلمة المرور:</label>
            <input type="password" id="loginPass" placeholder="••••••••">
        </div>
        <button class="login-btn" onclick="loginVendor()">دخول إلى لوحة التحكم</button>
    </div>

    <script>
        function loginVendor() {
            let phone = document.getElementById('loginPhone').value;
            if(phone === "") {
                alert("الرجاء إدخال رقم الهاتف!");
                return;
            }
            alert("تم تسجيل الدخول بنجاح! جاري تحويلك إلى لوحة التحكم الخاصة بمتجرك...");
            window.location.href = "vendor_dashboard.html";
        }
    </script>
</body>
</html>
