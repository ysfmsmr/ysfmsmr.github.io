<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل متجر جديد - مول لبنان</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #d4af37; text-align: center; }
        p { text-align: center; color: #aaa; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #d4af37; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: #fff; box-sizing: border-box; }
        textarea { resize: vertical; height: 100px; }
        .btn-submit { background-color: #d4af37; color: #000; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background-color: #c19b2e; }
        .success-msg { display: none; background: #28a745; color: white; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; margin-top: 20px; }
        .home-link { display: block; text-align: center; margin-top: 20px; color: #d4af37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>طلب فتح متجر أو اشتراك</h2>
        <p>أدخل بيانات محلك وسيتم مراجعة الطلب من الإدارة لتفعيله</p>

        <form id="regForm">
            <div class="form-group">
                <label>اسم التاجر أو المالك:</label>
                <input type="text" id="ownerName" placeholder="أدخل اسمك الثلاثي" required>
            </div>

            <div class="form-group">
                <label>اسم المحل أو المتجر:</label>
                <input type="text" id="shopName" placeholder="مثال: متجر العطور الشرقية" required>
            </div>

            <div class="form-group">
                <label>رقم الهاتف (واتساب):</label>
                <input type="text" id="phone" placeholder="مثال: 96170000000+" required>
            </div>

            <div class="form-group">
                <label>وصف مختصر للبضاعة:</label>
                <textarea id="description" placeholder="ماذا تبيع في متجرك؟" required></textarea>
            </div>

            <button type="submit" class="btn-submit">🚀 إرسال طلب الانضمام</button>
        </form>

        <div id="successMsg" class="success-msg">
            ✅ تم إرسال طلبك بنجاح يا أبو الزوز! سيتم مراجعته من الإدارة قريباً.
        </div>

        <a href="index.html" class="home-link">🏠 الرئيسية</a>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات الاتصال بفايربيس الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyD...", // تأكد من وضع مفتاحك الحقيقي هنا
            authDomain: "mall-lebanon.firebaseapp.com",
            projectId: "mall-lebanon",
            storageBucket: "mall-lebanon.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("regForm");
        const successMsg = document.getElementById("successMsg");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const ownerName = document.getElementById("ownerName").value;
            const shopName = document.getElementById("shopName").value;
            const phone = document.getElementById("phone").value;
            const description = document.getElementById("description").value;

            try {
                // إرسال البيانات إلى جدول vendor_requests في فايربيس
                await addDoc(collection(db, "vendor_requests"), {
                    ownerName: ownerName,
                    shopName: shopName,
                    phone: phone,
                    description: description,
                    createdAt: new Date()
                });

                // إخفاء النموذج وإظهار رسالة النجاح
                form.style.display = "none";
                successMsg.style.display = "block";

            } catch (error) {
                console.error("خطأ في إرسال الطلب: ", error);
                alert("حدث خطأ أثناء إرسال الطلب، تأكد من الاتصال بالإنترنت.");
            }
        });
    </script>
</body>
</html>
