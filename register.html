<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انضمام المحلات | مول لبنان</title>
  <style>
    :root {
      --primary: #d4a329;
      --dark-bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #15d664;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(212, 163, 41, 0.2);
    }

    h2 { color: var(--primary); margin-bottom: 10px; }
    p { color: #ccc; font-size: 14px; line-height: 1.6; }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    label { display: block; margin-bottom: 5px; color: var(--primary); font-size: 14px; }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
      box-sizing: border-box;
    }

    .btn-send {
      background: linear-gradient(135deg, #d4a329, #f3e08c);
      color: #000;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-home {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>✨ انضم إلى مول لبنان الإلكتروني</h2>
    <p>هل تملك محلاً في البقاع (الهرمل، بعلبك، زحلة) وتود عرض منتجاتك؟ تواصل معنا مباشرة لتفعيل حسابك وتسهيل عرض بضاعتك للزبائن.</p>

    <div class="form-group">
      <label>اسم المحل / المصلحة:</label>
      <input type="text" id="shopName" placeholder="مثال: أزياء الهرمل">
    </div>

    <div class="form-group">
      <label>المنطقة / العنوان:</label>
      <input type="text" id="shopLocation" placeholder="مثال: الهرمل - الشارع العام">
    </div>

    <div class="form-group">
      <label>رقم الواتساب للتواصل:</label>
      <input type="tel" id="shopPhone" placeholder="مثال: 96181703239">
    </div>

    <div class="form-group">
      <label>نوع البضاعة / الأقسام:</label>
      <textarea id="shopDetails" rows="3" placeholder="أحذية، عطور، ملابس..."></textarea>
    </div>

    <button class="btn-send" onclick="sendToAdmin()">💬 إرسال الطلب عبر الواتساب للإدارة</button>
  </div>

  <a href="index.html" class="btn-home">⬅️ العودة للرئيسية</a>

  <script>
    function sendToAdmin() {
      const name = document.getElementById('shopName').value;
      const loc = document.getElementById('shopLocation').value;
      const phone = document.getElementById('shopPhone').value;
      const details = document.getElementById('shopDetails').value;

      if (!name || !phone) {
        alert('الرجاء تعبئة اسم المحل ورقم الهاتف على الأقل.');
        return;
      }

      const msg = `طلب انضمام جديد لمول لبنان:%0A` +
                  `🏢 المحل: ${name}%0A` +
                  `📍 العنوان: ${loc}%0A` +
                  `📞 الواتساب: ${phone}%0A` +
                  `📦 البضاعة: ${details}`;

      // تحويل الطلب لمسؤول المول عبر الواتساب مباشرة
      window.open(`https://wa.me/96181703239?text=${msg}`, '_blank');
    }
  </script>

</body>
</html>
