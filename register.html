<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل متجر جديد - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f4; color: #222; }
        
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d4af37; position: relative; }
        header h1 { font-size: 24px; color: #d4af37; margin-bottom: 5px; }
        
        .back-btn { position: absolute; top: 15px; right: 15px; background: #d4af37; color: #111; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 13px; }
        
        .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #111; margin-bottom: 15px; text-align: center; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; text-align: center; }

        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; background: #fafafa; }
        input:focus, textarea:focus { border-color: #d4af37; outline: none; background: #fff; }

        .submit-btn { width: 100%; padding: 12px; background: #d4af37; color: #111; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #111; color: #d4af37; }

        .success-msg { display: none; background: #e8f8f5; color: #27ae60; padding: 15px; border-radius: 6px; font-weight: bold; margin-top: 20px; text-align: center; border: 1px solid #27ae60; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">🏠 الرئيسية</a>
    <h1>🛍️ انضم إلى مول لبنان</h1>
</header>

<div class="container">
    <h2>طلب فتح متجر أو اشتراك</h2>
    <p>أدخل بيانات محلك وسوف يتم مراجعة الطلب من الإدارة لتفعيله</p>

    <form id="regForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label>اسم التاجر أو المالك:</label>
            <input type="text" id="ownerName" required placeholder="أدخل اسمك الثلاثي">
        </div>

        <div class="form-group">
            <label>اسم المحل أو المتجر:</label>
            <input type="text" id="shopName" required placeholder="مثال: متجر العطور الشرقية">
        </div>

        <div class="form-group">
            <label>رقم الهاتف (واتساب):</label>
            <input type="tel" id="phone" required placeholder="مثال: 96170000000+">
        </div>

        <div class="form-group">
            <label>وصف مختصر للبضاعة:</label>
            <textarea id="shopDesc" rows="3" placeholder="ماذا تبيع في متجرك؟"></textarea>
        </div>

        <button type="submit" class="submit-btn">إرسال طلب الانضمام 🚀</button>
    </form>

    <div class="success-msg" id="successMsg">
        ✅ تم إرسال طلبك بنجاح يا أبو الزوز! سيتم مراجعته من الإدارة قريباً.
    </div>
</div>

<script>
    function submitForm(event) {
        event.preventDefault();
        
        const owner = document.getElementById('ownerName').value;
        const shop = document.getElementById('shopName').value;
        const phone = document.getElementById('phone').value;
        const desc = document.getElementById('shopDesc').value;

        const newRequest = { owner, shop, phone, desc, date: new Date().toLocaleDateString() };
        let requests = JSON.parse(localStorage.getItem('mallRequests')) || [];
        requests.push(newRequest);
        localStorage.setItem('mallRequests', JSON.stringify(requests));

        document.getElementById('regForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
    }
</script>

</body>
</html>
