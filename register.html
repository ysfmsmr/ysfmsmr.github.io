<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل متجر جديد - مول لبنان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; color: #333; direction: rtl; }
        
        header { background: #111; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        header h1 { font-size: 26px; color: #d4af37; margin-bottom: 5px; }

        .container { max-width: 500px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 20px; color: #111; text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .submit-btn { background: #d4af37; color: #111; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .submit-btn:hover { background: #c19b2e; }
        
        .note { font-size: 12px; color: #666; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>انضم إلى مول لبنان</h1>
        <p>سجل محلك معنا وابدأ بعرض منتجاتك للآلاف من الزبائن</p>
    </header>

    <div class="container">
        <h2>استمارة تسجيل تاجر جديد</h2>
        <div class="form-group">
            <label for="shopName">اسم المتجر أو المحل:</label>
            <input type="text" id="shopName" placeholder="مثلاً: محل الروائع للألبسة">
        </div>
        <div class="form-group">
            <label for="shopCategory">قسم النشاط التجاري:</label>
            <select id="shopCategory">
                <option value="clothes">قسم الألبسة</option>
                <option value="shoes">قسم الأحذية</option>
                <option value="perfumes">قسم العطورات</option>
            </select>
        </div>
        <div class="form-group">
            <label for="whatsappNumber">رقم الواتساب للتواصل والطلبات:</label>
            <input type="text" id="whatsappNumber" placeholder="مثلاً: 96170000000+">
        </div>
        <button class="submit-btn" onclick="submitRegistration()">إرسال طلب الانضمام (اشتراك 15$)</button>
        <p class="note">سيتم مراجعة طلبك وتفعيل متجرك من قِبل الإدارة فور تأكيد دفع اشتراك الـ 15$ الشهري.</p>
    </div>

    <script>
        function submitRegistration() {
            let name = document.getElementById('shopName').value;
            let whatsapp = document.getElementById('whatsappNumber').value;

            if(name === "" || whatsapp === "") {
                alert("الرجاء ملء جميع الحقول المطلوبة!");
                return;
            }

            alert("تم إرسال طلبك بنجاح يا أبا علي! سيظهر لدى المشرف في لوحة التحكم لمراجعته وتفعيله.");
            document.getElementById('shopName').value = '';
            document.getElementById('whatsappNumber').value = '';
        }
    </script>
</body>
</html>
